%YAML 1.2
---

$schema: http://devicetree.org/meta-schemas/core.yaml#

title: max77779 usecase state machine driver

maintainers:
  - Daniel Okazaki <dtokazaki@google.com>
  - Prasanna Prapancham <prapancham@google.com>
  - Jack Wu <wjack@google.com>

description: |
  max77779 usecase state machine driver. Control version control for configuring different state
  machines based on DTS config

properties:
  # A dictionary of DT properties for this binding schema
  compatible:
    enum:
      - max77779,usecase

  max77779,usecase-version:
    description: Usecase state machine version based on the max77779 charger. Default: 0

required:
  - compatible
