%YAML 1.2
---
$id: http://devicetree.org/schemas/i3c-thi/snps,dw-i3c-master-thi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Synopsys DesignWare I3C master transfer host isolated block

maintainers:
  - Bill Chang <billdir@google.com>
  - Ivan Zaitsev <zaitsev@google.com>

allOf:
  - $ref: i3c.yaml#

properties:
  compatible:
    const: snps,dw-i3c-master-thi

  clocks:
    maxItems: 1

  xfer-host-pdev:
    maxItems: 1
    description: Phandle of Isolated Transaction related kernel module

  external-power-control:
    type: boolean
    description: Enable external power control instead of auto runtime PM

required:
  - compatible
  - clocks
  - xfer-host-pdev

unevaluatedProperties: false

examples:
  - |
    i3c-master@2000 {
        compatible = "snps,dw-i3c-master-thi";
        #address-cells = <3>;
        #size-cells = <0>;
        clocks = <&i3cclk>;
        xfer-host-pdev = <&xfer_host>;

        eeprom@57{
            compatible = "atmel,24c01";
            reg = <0x57 0x0 0x10>;
            pagesize = <0x8>;
        };
    };
