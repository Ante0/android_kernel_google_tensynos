%YAML 1.2
---
$id: http://devicetree.org/schemas/i3c-thi/google,dw-i3c-xfer-ap-host.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Synopsys DesignWare I3C master AP transfer host AP block

maintainers:
  - Bill Chang <billdir@google.com>
  - Ivan Zaitsev <zaitsev@google.com>

properties:
  compatible:
    const: google,dw-i3c-xfer-ap-host

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  cmdfifodepth:
    maxItems: 1
    description: I3C IP command fifo depth.

  datafifodepth:
    maxItems: 1
    description: I3C IP data fifo depth.

required:
  - compatible
  - reg
  - interrupts
  - cmdfifodepth
  - datafifodepth

unevaluatedProperties: false

examples:
  - |
    xfer_host_ap: i3c-xfer-host@0 {
        compatible = "google,dw-i3c-xfer-ap-host";
        reg = <0x02000 0x1000>;
        interrupts = <0>;
        cmdfifodepth = <8>;
        datafifodepth = <32>;
    };

