%YAML 1.2
---
$id: http://devicetree.org/schemas/clk/google,clock.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Google CPM Clocks

description:
  This binding describes clocks managed by CPM clock controller.

properties:
  restore-rate-on-aoss-ssr:
    type: boolean
    description:
      Workaround for b/441499672, remove once b/441499672 is fixed. If present,
      clock rate is restored after AOSS sub-system reset. Only meaningful
      for clocks whose rate may be reset by SSR.
