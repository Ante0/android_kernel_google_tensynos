# SPDX-License-Identifier: GPL-2.0
%YAML 1.2
---
$id: http://devicetree.org/schemas/i3c/snps,dw-i3c-master.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Synopsys DesignWare I3C master block

maintainers:
  - Alexandre Belloni <alexandre.belloni@bootlin.com>

allOf:
  - $ref: i3c.yaml#

properties:
  compatible:
    const: snps,dw-i3c-master-1.00a

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  interrupts:
    maxItems: 1

  ibi-capable:
    type: boolean
    description: Mark if the device supports In-Band Interrupt

  hybrid-busy-wait-mode:
    type: boolean
    description:
      True if desired operation (transfer execution) mode is hybrid, false if
      interrupt mode should always be used. If not present, false/ir mode is
      automatically assumed

  i2c-hybrid-threshold:
    type: u32
    maxItems: 1
    description:
      If hybrid-busy-wait-mode is true, then this threshold is used to switch
      between busy-waiting and interrupt modes; busy-waiting is used for values
      below the threshold, otherwise interrupt mode is used.
      Unit is Bytes. It is recommended to omit this property, so the default
      value is used, unless one is sure of their choice and wants to customise
      the functionality.

  i3c-hybrid-threshold:
    type: u32
    maxItems: 1
    description:
      If hybrid-busy-wait-mode is true, then this threshold is used to switch
      between busy-waiting and interrupt modes; busy-waiting is used for values
      below the threshold, otherwise interrupt mode is used
      Unit is Bytes. It is recommended to omit this property, so the default
      value is used, unless one is sure of their choice and wants to customise
      the functionality.

  i3c-threaded-threshold:
    type: u32
    maxItems: 1
    description:
      Threshold in bytes to switch interrupt handling mode for non-DMA transfers.
      If the transfer length (total bytes) is greater than or equal to this threshold,
      the interrupt handling is woken up as a threaded bottom half handler;
      otherwise, it is handled entirely in the top half handler.
      Unit is Bytes. Default is 512 bytes.

  external-power-control:
    type: boolean
    description: Enable external power control instead of auto runtime PM

  pec-enable:
    type: boolean
    description:
      Enable Packet Error Check (CRC-8) on SDR private and CCC transfers, as
      well as on IBI transfers. It is not supported in HDR modes. It is used in
      both write and read transfers.

  hdr-ddr-capable:
    type: boolean
    description:
      Enables High Data Rate-Double Data Rate transfers for controllers and
      devices that support HDR-DDR. Note that HDR-DDR is only used for transfers
      above RX/TX_START_THLD, otherwise DDR-HDR overhead is not worth it. In
      case a transfer is too small, the controller will wait until the threshold
      amount of data is available to initiate the transfer.

  dma-align:
    type: u8
    description:
      Number of bytes which DMA addresses and buffers need to be aligned at. If
      not provided, the default value of 16 is used.

  dma-threshold-size:
    type: u32
    description:
      Number of bytes the transaction/message needs to be LARGER than (strict >)
      in order to use DMA instead of data FIFO CPU transmission. If not
      provided, the default value of the data FIFO is used.

  aoc-ssr-capable:
    type: boolean
    description:
      Set if I3C controller has to subscribe to AOC/AOSS SSR notifications and
      disable itself during SSR.

  i2c-speed-daa:
    type: boolean
    description:
      Set if fallback needed to safe I2C low frequency while executing OD stage of DAA command.

required:
  - compatible
  - reg
  - clocks
  - interrupts

unevaluatedProperties: false

examples:
  - |
    i3c-master@2000 {
        compatible = "snps,dw-i3c-master-1.00a";
        #address-cells = <3>;
        #size-cells = <0>;
        reg = <0x02000 0x1000>;
        interrupts = <0>;
        clocks = <&i3cclk>;

        hybrid-busy-wait-mode;
        i2c-hybrid-threshold = <30>;
        i3c-hybrid-threshold = <30>;
        i3c-threaded-threshold = <512>;

        pec-enable;
        hdr-ddr-capable;

        dma-align = <16>;
        dma-threshold-size = <128>;

        eeprom@57{
            compatible = "atmel,24c01";
            reg = <0x57 0x0 0x10>;
            pagesize = <0x8>;
        };
    };
...
